{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Onboard New Linux Node</h2>
    
    <form method="post">

        <div class="form-group">
            <label>Node Name:</label>
            <input type="text" name="name" placeholder="e.g., production-server-1">
        </div>
        
        <div class="form-group">
            <label>Node Type:</label>
            <select name="node_type" id="node_type" onchange="toggleSSHFields()" required>
                <option value="aws">AWS EC2</option>
                <option value="custom">Custom Server</option>
                <option value="docker">Docker Node</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>IP Address:</label>
            <input type="text" name="ip" required placeholder="e.g., 52.66.248.14 OR localhost:9101">
        </div>
        
        <div id="ssh_fields">
            <div class="form-group">
                <label>SSH Username:</label>
                <input type="text" name="username" placeholder="ubuntu (AWS) or nodeusr">
            </div>
            
            <div class="form-group">
                <label>SSH Password:</label>
                <input type="password" name="password" placeholder="Password (if using password auth)">
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" name="use_key"> Use SSH Key (AWS EC2)
                </label>
            </div>
        </div>
        
        <button type="submit" class="btn-add">Onboard Node</button>
    </form>
</div>

<script>
function toggleSSHFields() {
    const type = document.getElementById("node_type").value;
    const sshFields = document.getElementById("ssh_fields");

    if (type === "docker") {
        sshFields.style.display = "none";
    } else {
        sshFields.style.display = "block";
    }
}
</script>

{% endblock %}
